<svg width="1200" height="1600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 24px; font-weight: bold; fill: #333; }
      .stage-title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #fff; }
      .stage-text { font-family: Arial, sans-serif; font-size: 12px; fill: #333; }
      .arrow { stroke: #666; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .box-input { fill: #4a90e2; stroke: #2c5aa0; stroke-width: 2; }
      .box-process1 { fill: #7b68ee; stroke: #5a4fcc; stroke-width: 2; }
      .box-process2 { fill: #50c878; stroke: #3a9d5a; stroke-width: 2; }
      .box-process3 { fill: #ff6b9d; stroke: #cc4a7a; stroke-width: 2; }
      .box-process4 { fill: #ffa500; stroke: #cc8400; stroke-width: 2; }
      .box-process5 { fill: #ffd700; stroke: #ccaa00; stroke-width: 2; }
      .box-output { fill: #87ceeb; stroke: #6ba8bb; stroke-width: 2; }
      .box-llm { fill: #98d8c8; stroke: #78b8a8; stroke-width: 2; }
      .box-display { fill: #4a90e2; stroke: #2c5aa0; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" class="title">Pickleball Training Chatbot System Pipeline</text>
  
  <!-- Stage 1: Input -->
  <rect x="450" y="80" width="300" height="80" rx="10" class="box-input"/>
  <text x="600" y="110" text-anchor="middle" class="stage-title">1. Video Upload</text>
  <text x="600" y="130" text-anchor="middle" class="stage-text">User uploads 3-5s video</text>
  <text x="600" y="145" text-anchor="middle" class="stage-text">Session ID (UUID) created</text>
  
  <!-- Arrow 1 -->
  <line x1="600" y1="160" x2="600" y2="200" class="arrow"/>
  
  <!-- Stage 2: Frame Extraction -->
  <rect x="400" y="200" width="400" height="100" rx="10" class="box-process1"/>
  <text x="600" y="230" text-anchor="middle" class="stage-title">2. Frame Extraction</text>
  <text x="600" y="250" text-anchor="middle" class="stage-text">Sharpness Score (Laplacian variance)</text>
  <text x="600" y="265" text-anchor="middle" class="stage-text">Motion Score + Pose Detection Score</text>
  <text x="600" y="280" text-anchor="middle" class="stage-text">Extract ~10 keyframes</text>
  
  <!-- Arrow 2 -->
  <line x1="600" y1="300" x2="600" y2="340" class="arrow"/>
  
  <!-- Stage 3: Parallel Processing -->
  <!-- MediaPipe -->
  <rect x="100" y="340" width="400" height="100" rx="10" class="box-process2"/>
  <text x="300" y="370" text-anchor="middle" class="stage-title">3a. Pose Estimation</text>
  <text x="300" y="390" text-anchor="middle" class="stage-text">MediaPipe Pose</text>
  <text x="300" y="405" text-anchor="middle" class="stage-text">33 Body Landmarks</text>
  <text x="300" y="420" text-anchor="middle" class="stage-text">Coordinates (x, y, z) + Visibility</text>
  
  <!-- Vision LLM -->
  <rect x="700" y="340" width="400" height="100" rx="10" class="box-process2"/>
  <text x="900" y="370" text-anchor="middle" class="stage-title">3b. Vision LLM Analysis</text>
  <text x="900" y="390" text-anchor="middle" class="stage-text">BLIP Model (Hugging Face)</text>
  <text x="900" y="405" text-anchor="middle" class="stage-text">Stance, Balance, Rotation</text>
  <text x="900" y="420" text-anchor="middle" class="stage-text">Arm Extension, Hand Position</text>
  
  <!-- Arrows from Frame Extraction -->
  <line x1="500" y1="350" x2="500" y2="390" class="arrow"/>
  <line x1="700" y1="350" x2="700" y2="390" class="arrow"/>
  
  <!-- Arrow 3 -->
  <line x1="300" y1="440" x2="300" y2="480" class="arrow"/>
  <line x1="900" y1="440" x2="900" y2="480" class="arrow"/>
  
  <!-- Stage 4: Data Combination -->
  <rect x="400" y="480" width="400" height="80" rx="10" class="box-process3"/>
  <text x="600" y="510" text-anchor="middle" class="stage-title">4. Data Combination</text>
  <text x="600" y="530" text-anchor="middle" class="stage-text">Merge MediaPipe Pose + Vision LLM Insights</text>
  <text x="600" y="545" text-anchor="middle" class="stage-text">Unified data structure</text>
  
  <!-- Arrow 4 -->
  <line x1="600" y1="560" x2="600" y2="600" class="arrow"/>
  
  <!-- Stage 5: Phase Detection -->
  <rect x="400" y="600" width="400" height="100" rx="10" class="box-process4"/>
  <text x="600" y="630" text-anchor="middle" class="stage-title">5. Phase Detection</text>
  <text x="600" y="650" text-anchor="middle" class="stage-text">READY → BACKSWING → CONTACT → FOLLOW_THROUGH</text>
  <text x="600" y="665" text-anchor="middle" class="stage-text">Calculate: Wrist velocity, Elbow angles,</text>
  <text x="600" y="680" text-anchor="middle" class="stage-text">Shoulder rotation, Hand positions</text>
  
  <!-- Arrow 5 -->
  <line x1="600" y1="700" x2="600" y2="740" class="arrow"/>
  
  <!-- Stage 6: Rule Evaluation -->
  <rect x="400" y="740" width="400" height="100" rx="10" class="box-process5"/>
  <text x="600" y="770" text-anchor="middle" class="stage-title">6. Rule-Based Evaluation</text>
  <text x="600" y="790" text-anchor="middle" class="stage-text">Phase completeness, Joint angles,</text>
  <text x="600" y="805" text-anchor="middle" class="stage-text">Motion quality, Visual form</text>
  <text x="600" y="820" text-anchor="middle" class="stage-text">Issue detection with severity levels</text>
  
  <!-- Arrow 6 -->
  <line x1="600" y1="840" x2="600" y2="880" class="arrow"/>
  
  <!-- Stage 7: Structured Feedback -->
  <rect x="400" y="880" width="400" height="80" rx="10" class="box-output"/>
  <text x="600" y="910" text-anchor="middle" class="stage-title">7. Structured Feedback</text>
  <text x="600" y="930" text-anchor="middle" class="stage-text">Issue codes (FH00-FH08, BH00-BH08)</text>
  <text x="600" y="945" text-anchor="middle" class="stage-text">Severity + Coaching tips</text>
  
  <!-- Arrow 7 -->
  <line x1="600" y1="960" x2="600" y2="1000" class="arrow"/>
  
  <!-- Stage 8: Text LLM -->
  <rect x="400" y="1000" width="400" height="80" rx="10" class="box-llm"/>
  <text x="600" y="1030" text-anchor="middle" class="stage-title">8. Text LLM Processing</text>
  <text x="600" y="1050" text-anchor="middle" class="stage-text">OpenAI / Anthropic / Ollama / Placeholder</text>
  <text x="600" y="1065" text-anchor="middle" class="stage-text">Generate natural language feedback</text>
  
  <!-- Arrow 8 -->
  <line x1="600" y1="1080" x2="600" y2="1120" class="arrow"/>
  
  <!-- Stage 9: Display -->
  <rect x="450" y="1120" width="300" height="80" rx="10" class="box-display"/>
  <text x="600" y="1150" text-anchor="middle" class="stage-title">9. User Interface</text>
  <text x="600" y="1170" text-anchor="middle" class="stage-text">Display coaching feedback</text>
  <text x="600" y="1185" text-anchor="middle" class="stage-text">Chat interface for questions</text>
  
  <!-- Legend -->
  <rect x="50" y="1250" width="1100" height="300" fill="#f5f5f5" stroke="#ccc" stroke-width="2" rx="10"/>
  <text x="600" y="1280" text-anchor="middle" class="title" font-size="18">Pipeline Components</text>
  
  <!-- Legend Items -->
  <rect x="100" y="1300" width="20" height="20" class="box-input"/>
  <text x="140" y="1315" class="stage-text">Input/Output Stages</text>
  
  <rect x="100" y="1330" width="20" height="20" class="box-process1"/>
  <text x="140" y="1345" class="stage-text">Frame Processing</text>
  
  <rect x="100" y="1360" width="20" height="20" class="box-process2"/>
  <text x="140" y="1375" class="stage-text">Parallel Analysis (MediaPipe + Vision LLM)</text>
  
  <rect x="100" y="1390" width="20" height="20" class="box-process3"/>
  <text x="140" y="1405" class="stage-text">Data Fusion</text>
  
  <rect x="100" y="1420" width="20" height="20" class="box-process4"/>
  <text x="140" y="1435" class="stage-text">Phase Detection</text>
  
  <rect x="100" y="1450" width="20" height="20" class="box-process5"/>
  <text x="140" y="1465" class="stage-text">Rule Evaluation</text>
  
  <rect x="600" y="1300" width="20" height="20" class="box-output"/>
  <text x="640" y="1315" class="stage-text">Structured Output</text>
  
  <rect x="600" y="1330" width="20" height="20" class="box-llm"/>
  <text x="640" y="1345" class="stage-text">LLM Processing</text>
  
  <text x="100" y="1500" class="stage-text" font-size="14" font-weight="bold">Key Features:</text>
  <text x="100" y="1520" class="stage-text">• Hybrid approach: Quantitative (MediaPipe) + Qualitative (Vision LLM)</text>
  <text x="100" y="1540" class="stage-text">• Rule-based evaluation ensures transparent, consistent feedback</text>
  <text x="100" y="1560" class="stage-text">• Supports both Forehand and Two-Handed Backhand analysis</text>
</svg>
















