<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pickleball Training Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 30px;
        }

        .section h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        select, input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        select:focus, input[type="file"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .file-input-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .file-input-label {
            display: block;
            padding: 15px;
            background: #f5f5f5;
            border: 2px dashed #ccc;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .file-input-label:hover {
            background: #e8e8e8;
            border-color: #667eea;
        }

        .file-name {
            margin-top: 10px;
            color: #666;
            font-size: 14px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #6c757d;
            margin-top: 10px;
        }

        .status {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }

        .status.show {
            display: block;
        }

        .feedback-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .feedback-section.show {
            display: block;
        }

        .feedback-content {
            background: white;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            margin-top: 15px;
        }

        .feedback-content h3 {
            color: #333;
            margin-bottom: 15px;
        }

        .feedback-text {
            color: #555;
            line-height: 1.6;
            font-size: 16px;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .progress-steps {
            margin: 20px 0;
        }

        .step {
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            background: #f0f0f0;
            display: flex;
            align-items: center;
        }

        .step.active {
            background: #e3f2fd;
            color: #1976d2;
        }

        .step.completed {
            background: #c8e6c9;
            color: #2e7d32;
        }

        .step-icon {
            margin-right: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏓 Pickleball Training Chatbot</h1>
            <p>Upload your training video and get AI-powered coaching feedback</p>
        </div>

        <div class="content">
            <!-- Status Messages -->
            <div id="status" class="status"></div>

            <!-- Progress Steps -->
            <div class="progress-steps" id="progressSteps" style="display: none;">
                <div class="step" id="step1">
                    <span class="step-icon">1️⃣</span>
                    <span>Uploading video...</span>
                </div>
                <div class="step" id="step2">
                    <span class="step-icon">2️⃣</span>
                    <span>Analyzing video...</span>
                </div>
                <div class="step" id="step3">
                    <span class="step-icon">3️⃣</span>
                    <span>Generating feedback...</span>
                </div>
            </div>

            <!-- Upload Section -->
            <div class="section">
                <h2>1. Select Skill</h2>
                <div class="form-group">
                    <label for="skill">Training Skill:</label>
                    <select id="skill">
                        <option value="drive_forehand">Drive Forehand</option>
                        <option value="drive_two_backhand">Drive Two-Handed Backhand</option>
                    </select>
                </div>
            </div>

            <div class="section">
                <h2>2. Upload Video</h2>
                <div class="form-group">
                    <label for="videoFile">Choose Video File (3-5 seconds):</label>
                    <div class="file-input-wrapper">
                        <label for="videoFile" class="file-input-label">
                            📹 Click to select video file
                        </label>
                        <input type="file" id="videoFile" accept="video/*" style="display: none;">
                        <div class="file-name" id="fileName"></div>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <button class="btn" id="analyzeBtn" onclick="startAnalysis()">
                🚀 Start Analysis
            </button>
            <button class="btn btn-secondary" id="resetBtn" onclick="resetForm()" style="display: none;">
                🔄 Upload Another Video
            </button>

            <!-- Feedback Section -->
            <div class="feedback-section" id="feedbackSection">
                <h2>📊 Coaching Feedback</h2>
                <div class="feedback-content">
                    <h3>Your Personalized Feedback:</h3>
                    <div class="feedback-text" id="feedbackText"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
